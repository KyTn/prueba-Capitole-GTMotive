openapi: 3.0.3
info:
  title: GT Motive Renting API - Return Vehicle
  version: 1.0.0
paths:
  /rentals/returns:
    post:
      summary: Return a vehicle held by its current renter
      operationId: returnVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnVehicleRequest'
      responses:
        '200':
          description: Rental closed and vehicle made available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnedRental'
        '400':
          description: Missing or malformed identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Person or vehicle not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Vehicle has no active rental, belongs to another person, or was already returned
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected failure without internal details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ReturnVehicleRequest:
      type: object
      required:
        - personId
        - vehicleId
      properties:
        personId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
      additionalProperties: false
    ReturnedRental:
      type: object
      required:
        - id
        - personId
        - vehicleId
        - startedAt
        - endedAt
        - status
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - closed
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
